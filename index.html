<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050b24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Oído Fino · II Edición</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--u:1vw;--blue:#1f5bff;--gold:#ffc83d;--gold2:#ff9f1c;--ok:#16c15a;--bad:#ef3b3b;--rw:min(calc(100vw - 24px),max(170px,calc(100dvh - 470px)))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#030818;color:#fff;font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit}
.ic{flex:none;display:block}

/* ---------- fondo de escenario ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#1d43b3 0%,#0b1c5e 38%,#050d33 70%,#02061a 100%)}
#bg .beam{position:absolute;top:-25%;width:60vmax;height:150%;background:linear-gradient(180deg,rgba(140,185,255,.34),rgba(140,185,255,0) 72%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);transform-origin:50% 0;animation:sweep 9s ease-in-out infinite alternate}
#bg .b1{left:-22vmax;--a:-22deg;--b:12deg}
#bg .b2{left:50%;margin-left:-30vmax;--a:15deg;--b:-16deg;animation-duration:12s;background:linear-gradient(180deg,rgba(255,200,61,.26),rgba(255,200,61,0) 72%)}
#bg .b3{right:-22vmax;--a:22deg;--b:-10deg;animation-duration:14s}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
#bg .staff{position:absolute;left:0;width:100%;height:90px;opacity:.16}
#bg .staff line{stroke:#9db8ff;stroke-width:1.2}
#bg .note{position:absolute;color:#ffd980;opacity:.14;animation:floaty 14s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-34px) rotate(8deg)}}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 120%,rgba(31,91,255,.35),transparent 60%)}

/* ---------- estructura ---------- */
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
header.top{flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#0a1a58,#071240);border-bottom:2px solid rgba(255,200,61,.55);box-shadow:0 4px 18px rgba(0,0,0,.4)}
header.top .ttl{flex:1;text-align:center;font-weight:900;letter-spacing:.08em;color:var(--gold);font-size:17px;white-space:nowrap}
header.top .ttl small{color:#fff;opacity:.85;font-weight:700;margin-left:6px;font-size:12px}
.ib{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff;padding:0}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.3}
main.view{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:none;position:relative;padding:8px 12px 10px;overflow:hidden}
.controls{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(#0b1b5acc,#050b24f5);border-top:2px solid rgba(255,200,61,.45);border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:10px}
.present .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 16px}
.present .controls{display:none}
.exitp{position:fixed;right:6px;bottom:6px;z-index:15;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;opacity:.18;display:grid;place-items:center}
.exitp:active{opacity:.9}

@media (orientation:landscape) and (min-aspect-ratio:5/4){
  :root{--rw:min(calc(100dvh - 112px),48vw)}
  header.top{height:46px}
  .ib{width:40px;height:40px}
  main.view{flex-direction:row}
  .stage{flex:1.25 1 0;min-width:0}
  .controls{flex:1 1 0;border-radius:20px 0 0 0;border-top:0;border-left:2px solid rgba(255,200,61,.45);padding-top:10px}
  .present .stage{flex:1}
  body.present{--rw:min(calc(100dvh - 82px),62vw)}
}
body.present{--rw:min(calc(100vw - 24px),calc(100dvh - 300px))}
body.present .strip{grid-template-columns:repeat(3,1fr);gap:8px}
body.present .strip .sn{font-size:clamp(12px,calc(3.4*var(--u)),22px)}
body.present .strip b{font-size:clamp(26px,calc(8*var(--u)),52px)}
@media (orientation:landscape) and (min-aspect-ratio:5/4){body.present{--rw:min(calc(100dvh - 82px),62vw)}}

/* ---------- botones ---------- */
.btn{min-height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:linear-gradient(#2f66ff,#1740c4);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;box-shadow:0 4px 0 #0a1f73,0 8px 18px rgba(0,0,0,.35);text-align:center;line-height:1.1;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1f73}
.btn:disabled{opacity:.38;pointer-events:none}
.btn small{font-weight:700;opacity:.9;font-size:.78em}
.btn.gold{background:linear-gradient(#ffe083,#ffb700);color:#2b1c00;border-color:#fff3c4;box-shadow:0 4px 0 #a86b00,0 8px 18px rgba(0,0,0,.35)}
.btn.ok{background:linear-gradient(#2fe27b,#0f9d45);box-shadow:0 4px 0 #076b2e,0 8px 18px rgba(0,0,0,.35)}
.btn.bad{background:linear-gradient(#ff6a6a,#d42020);box-shadow:0 4px 0 #8c1010,0 8px 18px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border-color:rgba(255,255,255,.3)}
.btn.sel{outline:4px solid #fff;outline-offset:2px}
.btn.big{min-height:68px;font-size:19px}
.btn.xl{min-height:78px;font-size:21px;letter-spacing:.03em}
.btn.sm{min-height:48px;font-size:16px;padding:6px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row3 .btn{padding:6px 4px;font-size:17px;flex-direction:column;gap:2px}
.lbl{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9db8ff}
.lbl b{color:var(--gold);font-size:1.5em}
.hint{font-size:15px;color:#c3d3ff;line-height:1.35}
.hint.c{text-align:center}

/* selector de equipos */
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tb{min-height:54px;border-radius:15px;border:3px solid transparent;background:var(--c);color:var(--ink);font-weight:900;font-size:17px;padding:4px 6px;display:grid;place-items:center;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.tb span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.on{border-color:#fff;transform:scale(1.05);box-shadow:0 0 0 3px var(--c),0 0 26px var(--c)}
.picker.has .tb:not(.on){opacity:.5}
.picker.two{grid-template-columns:1fr 1fr}

/* ---------- títulos ---------- */
.lockup{text-align:center;line-height:1}
.lockup .l1{font-size:clamp(46px,calc(16*var(--u)),128px);font-weight:900;letter-spacing:.06em;background:linear-gradient(#fff6cf 8%,#ffc83d 52%,#c97d00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(255,190,50,.5))}
.lockup .l2{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(18px,calc(5.6*var(--u)),40px);font-weight:900;letter-spacing:.3em;margin-top:6px}
.lockup .l2:before,.lockup .l2:after{content:"";height:3px;width:12vw;background:linear-gradient(90deg,transparent,var(--gold))}
.lockup .l2:after{transform:scaleX(-1)}
.lockup .l3{font-size:clamp(11px,calc(3.4*var(--u)),24px);font-weight:800;letter-spacing:.22em;color:var(--gold);margin-top:8px}
.lockup.sm .l1{font-size:clamp(34px,calc(11*var(--u)),70px)}
.lockup.sm .l2{font-size:clamp(14px,calc(4*var(--u)),24px)}
.lockup.sm .l3{font-size:clamp(9px,calc(2.6*var(--u)),15px)}
.stitle{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px;font-weight:900;letter-spacing:.1em;font-size:clamp(13px,calc(3.6*var(--u)),22px);text-transform:uppercase;color:var(--gold)}
.stitle span{color:#fff;letter-spacing:.06em}
.stitle:before{content:"";align-self:stretch;width:5px;border-radius:3px;background:linear-gradient(var(--gold),var(--gold2))}
.present .stitle{font-size:clamp(16px,calc(3.4*var(--u)),34px)}

/* ---------- tarjetas de equipo ---------- */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.present .tgrid{flex:1;grid-auto-rows:1fr;gap:12px}
.tc{position:relative;border-radius:16px;padding:8px 12px;border:2px solid var(--c);background:#0a1648;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:74px}
.tc:before{content:"";position:absolute;inset:0;background:var(--c);opacity:.26}
.tc>*{position:relative}
.tc.sel{box-shadow:0 0 0 3px #fff,0 0 28px var(--c);transform:scale(1.025)}
.tc .nm{font-weight:900;font-size:clamp(15px,calc(4.4*var(--u)),30px);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .pt{font-weight:900;font-size:clamp(28px,calc(8.4*var(--u)),66px);line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.tc .pt.dash{opacity:.5}
.tc .pt.good{color:#5cff9b}.tc .pt.badc{color:#ff7a7a}
.dots{display:flex;gap:6px;margin:3px 0}
.dots i{width:clamp(20px,calc(6*var(--u)),38px);height:clamp(20px,calc(6*var(--u)),38px);border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;background:rgba(0,0,0,.25)}
.dots i.ok{background:var(--ok);border-color:#c6ffd9}.dots i.bad{background:var(--bad);border-color:#ffc9c9}
.cm{display:flex;align-items:center;gap:6px;font-size:clamp(10px,calc(2.8*var(--u)),18px);font-weight:800;letter-spacing:.06em;color:#bfe0ff}
.cm.used{color:#ffb4b4;text-decoration:line-through;opacity:.8}
.tag{display:inline-block;font-size:clamp(10px,calc(2.8*var(--u)),17px);font-weight:900;letter-spacing:.05em;padding:2px 8px;border-radius:99px;margin:2px 4px 0 0;background:rgba(255,255,255,.14)}
.tag.on{background:var(--ok)}
.tag.ph{visibility:hidden}

body:not(.present) .s-p2 .tgrid,body:not(.present) .s-p3 .tgrid{grid-template-columns:repeat(3,1fr);gap:6px}
body:not(.present) .s-p2 .tc,body:not(.present) .s-p3 .tc{min-height:64px;padding:6px 8px}
body:not(.present) .s-p2 .tc .nm,body:not(.present) .s-p3 .tc .nm{font-size:clamp(12px,calc(3.4*var(--u)),17px)}
body:not(.present) .s-p2 .tc .pt,body:not(.present) .s-p3 .tc .pt{font-size:clamp(24px,calc(7*var(--u)),40px)}
body:not(.present) .s-p2 .tag{font-size:10px;padding:1px 6px}
.fnav{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center}
.fcur{text-align:center;font-weight:900;letter-spacing:.1em;font-size:14px;color:#9fc0ff}
.fcur b{display:block;font-size:34px;color:var(--gold);letter-spacing:0;line-height:1}
/* ---------- ranking ---------- */
.rks{display:flex;flex-direction:column;gap:8px}
.present .rks{flex:1}
.rk{position:relative;flex:1 0 auto;min-height:62px;border-radius:18px;overflow:hidden;background:#0a1648;border:2px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px}
.rk .bar{position:absolute;left:0;top:0;bottom:0;width:calc(var(--w)*1%);background:var(--c);opacity:.6;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.rk>*:not(.bar){position:relative}
.rk .pos{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:24px;background:#16296d;border:2px solid rgba(255,255,255,.4);flex:none}
.rk.q1 .pos{background:linear-gradient(#fff0a8,#ffb700);color:#2a1c00;border-color:#fff}
.rk.q2 .pos{background:linear-gradient(#f2f4fa,#aab2c8);color:#1a2030}
.rk.q3 .pos{background:linear-gradient(#f0b27a,#b8692c);color:#2a1300}
.rk .nm{flex:1;min-width:0;font-weight:900;font-size:clamp(18px,calc(5.4*var(--u)),40px);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.rk .pt{font-weight:900;font-size:clamp(28px,calc(8.4*var(--u)),60px);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.rk.lead{border-color:var(--gold);box-shadow:0 0 26px rgba(255,200,61,.55)}
.rk .crown{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,200,61,.8))}
.rk .tbk{font-style:normal;font-size:11px;font-weight:900;letter-spacing:.08em;background:var(--gold);color:#2a1c00;border-radius:99px;padding:3px 8px}

/* ---------- rosco ---------- */
.p4w{display:flex;flex-direction:column;align-items:center;gap:8px}
.banner{display:flex;flex-direction:column;align-items:center;border-radius:16px;padding:5px 22px;border:2px solid var(--gold);background:linear-gradient(#1b44c2,#0e2a8c);box-shadow:0 0 22px rgba(31,91,255,.7)}
.banner small{font-size:clamp(10px,calc(2.8*var(--u)),16px);font-weight:800;letter-spacing:.14em;color:#cfe0ff}
.banner b{font-size:clamp(18px,calc(5.6*var(--u)),36px);font-weight:900;letter-spacing:.1em;color:#fff}
.banner.r2{background:linear-gradient(#ffb200,#d46b00);border-color:#fff3c4}
.banner.r2 b{color:#2b1500}.banner.r2 small{color:#4b2a00}
.p4row{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.roscowrap{position:relative;width:var(--rw);aspect-ratio:1;container-type:inline-size;flex:none}
.rosco{width:100%;height:100%;display:block;overflow:visible}
.lx{font-size:6.2px;font-weight:900;pointer-events:none}
.lt{cursor:pointer}
.in{transform-box:fill-box;transform-origin:center}
.lt.cur .in{animation:curp .9s ease-in-out infinite alternate}
@keyframes curp{from{transform:scale(1)}to{transform:scale(1.2)}}
.lt.pop .in{animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.55)}100%{transform:scale(1)}}
.ring{fill:none;stroke:#ffe083;stroke-width:.9;filter:drop-shadow(0 0 1.4px #ffb700)}
.mq{fill:#ffd980}.mq.a{animation:bl 1.2s steps(1) infinite}.mq.b{animation:bl 1.2s steps(1) infinite .6s}
@keyframes bl{0%{opacity:1}50%{opacity:.18}}
.rc{position:absolute;inset:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4cqw;pointer-events:none}
.rc-round{font-size:4.4cqw;font-weight:900;letter-spacing:.14em;color:#9fc0ff}
.rc-letter{font-size:33cqw;font-weight:900;line-height:.86;color:#ffd24d;text-shadow:0 0 .12em #ff9f1c,0 .035em 0 #8a5200}
.rc-big{font-size:8.6cqw;font-weight:900;line-height:1.05;color:#ffd24d;letter-spacing:.04em}
.rc-hint{font-size:4.4cqw;color:#bcd1ff;font-weight:800}
.rc-sel{font-size:5.2cqw;background:var(--c);color:var(--ink);padding:.3em .8em;border-radius:99px;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;box-shadow:0 0 3cqw var(--c)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,640px);margin-top:12px}
.strip .sc{position:relative;border-radius:12px;background:#0a1648;border:2px solid var(--c);padding:3px 2px 4px;text-align:center;min-width:0}
.strip .sc:before{content:"";position:absolute;inset:0;background:var(--c);opacity:.3;border-radius:10px}
.strip .sc>*{position:relative}
.strip .sn{display:block;font-size:clamp(12px,calc(3.6*var(--u)),20px);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip b{display:block;font-size:clamp(20px,calc(6*var(--u)),40px);font-weight:900;line-height:1.05}
.strip .sc.lead{box-shadow:0 0 14px var(--gold);border-color:var(--gold)}
.strip .cr{position:absolute;top:-13px;left:50%;transform:translateX(-50%);color:var(--gold);filter:drop-shadow(0 0 4px #ffb700)}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .p4row{flex-direction:row;justify-content:center}
  .strip,body.present .strip{grid-template-columns:1fr;width:clamp(120px,calc(22*var(--u)),220px);gap:5px;margin-top:0}
  .strip .sc{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 10px;text-align:left}
  .strip .sn{flex:1;font-size:clamp(11px,calc(1.9*var(--u)),20px)}
  .strip b{font-size:clamp(18px,calc(3.2*var(--u)),34px)}
}

/* ---------- melodía ---------- */
.frag{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 6px}
.fn{display:flex;align-items:baseline;gap:8px}
.fn small{font-weight:900;letter-spacing:.16em;color:#9fc0ff;font-size:clamp(11px,calc(3.2*var(--u)),22px)}
.fn b{font-size:clamp(48px,calc(15*var(--u)),110px);font-weight:900;color:#ffd24d;line-height:1;text-shadow:0 0 18px rgba(255,159,28,.7)}
.fn em{font-style:normal;font-weight:800;font-size:clamp(16px,calc(4.6*var(--u)),32px);color:#9fc0ff}
.eq{display:flex;align-items:flex-end;gap:4px;height:clamp(40px,calc(12*var(--u)),90px)}
.eq i{width:clamp(6px,calc(1.8*var(--u)),12px);height:30%;border-radius:4px;background:linear-gradient(#ffe083,#ff9f1c)}
.eq.on i{animation:eqa .7s ease-in-out infinite alternate}
.eq i:nth-child(2n){animation-duration:.5s!important}.eq i:nth-child(3n){animation-duration:.9s!important}.eq i:nth-child(4){animation-delay:-.3s!important}
@keyframes eqa{from{height:18%}to{height:100%}}
.fdots{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.fdots i{font-style:normal;width:clamp(28px,calc(8*var(--u)),50px);height:clamp(28px,calc(8*var(--u)),50px);border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.35);font-weight:900;font-size:clamp(13px,calc(3.6*var(--u)),24px);background:rgba(0,0,0,.25)}
.fdots i.on{background:var(--gold);color:#2a1c00;border-color:#fff}
.fdots i.done:not(.on){background:#1c8a4b;border-color:#aef2c8}
.fsel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fsel .btn{min-height:56px;font-size:22px;position:relative;padding:4px}
.fsel .btn.on{background:linear-gradient(#ffe083,#ffb700);color:#2b1c00}
.fsel .btn i{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:#5cff9b}
.player{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:76px 76px 1fr;gap:8px;align-items:center}
.atime{font-weight:800;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;color:#cfe0ff}
.rng{width:100%;height:36px;accent-color:#ffc83d;margin:0}
.vrow{display:flex;align-items:center;gap:8px;color:#9fc0ff}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* ---------- ajustes, menú ---------- */
.tile{display:flex;align-items:center;gap:14px;min-height:72px;border-radius:18px;border:2px solid rgba(255,255,255,.22);background:linear-gradient(#17348f,#0e2268);padding:8px 14px;text-align:left;box-shadow:0 4px 0 #071240}
.tile:active{transform:translateY(3px)}
.tile.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.35),0 0 20px rgba(255,200,61,.4)}
.tile b{width:46px;height:46px;border-radius:50%;background:linear-gradient(#ffe083,#ffb700);color:#2a1c00;display:grid;place-items:center;font-size:24px;font-weight:900;flex:none}
.tile span{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile em{font-style:normal;font-weight:800;font-size:18px;line-height:1.15}
.tile small{color:#9fc0ff;font-size:14px;font-weight:700}
.nrow{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:center}
.nrow .dot{width:18px;height:46px;border-radius:6px;background:var(--c)}
.nin{width:100%;height:50px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-size:20px;font-weight:800;padding:0 12px;text-transform:uppercase}
.nin:focus{outline:none;border-color:var(--gold)}
.nrow small{grid-column:2;color:#9fc0ff;font-weight:700;margin-top:-6px}
.mrow{display:grid;grid-template-columns:12px 1fr 54px 52px 54px;gap:6px;align-items:center}
.mrow .dot{height:44px;border-radius:5px;background:var(--c)}
.mrow .nin{height:46px;font-size:17px;padding:0 8px}
.mrow .mt{text-align:center;font-size:24px;font-weight:900}
.mrow .btn{min-height:50px;padding:0}
.bd{grid-column:2/-1;font-size:13px;color:#9fc0ff;font-weight:700;margin:-4px 0 4px}
.diag{font-size:14px;color:#c3d3ff;line-height:1.6;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px}
.diag b.ok{color:#5cff9b}.diag b.no{color:#ffb4b4}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:52px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.3);font-size:20px;font-weight:900;color:#fff}
.slot.ok{background:var(--ok)}.slot.bad{background:var(--bad)}

/* ---------- final / ganador ---------- */
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.win .trophy{width:clamp(110px,calc(34*var(--u)),250px);filter:drop-shadow(0 0 26px rgba(255,200,61,.8));animation:float 2.4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-12px) scale(1.03)}}
.win .wk{font-size:clamp(22px,calc(7.5*var(--u)),56px);font-weight:900;letter-spacing:.2em;color:#fff;text-shadow:0 0 22px #ffb700}
.win .wn{font-size:clamp(36px,calc(13*var(--u)),120px);font-weight:900;text-transform:uppercase;line-height:1.02;color:var(--c);text-shadow:0 0 .35em var(--c),0 4px 0 rgba(0,0,0,.45);-webkit-text-stroke:2px #fff;paint-order:stroke fill;max-width:100%;overflow-wrap:anywhere}
.win .ws{font-size:clamp(18px,calc(5.4*var(--u)),38px);font-weight:900;color:var(--gold);letter-spacing:.12em}
.win .wf{font-size:clamp(10px,calc(2.8*var(--u)),18px);letter-spacing:.2em;font-weight:800;color:#bcd1ff;margin-top:8px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;display:none}
.tiecard{display:grid;gap:10px}
.tiecard .tc{min-height:96px;align-items:center;text-align:center}
.tiecard .tc.win{box-shadow:0 0 0 4px var(--gold),0 0 34px var(--gold)}
.ribbon{position:absolute!important;top:0;right:0;left:0;background:var(--gold);color:#2a1c00;font-weight:900;font-size:12px;letter-spacing:.14em;padding:2px}

/* ---------- cronómetro ---------- */
.tbar{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:8px}
.tbig{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em;min-width:112px;text-align:center}
.tbig.warn,.tbig2.warn{color:#ff6a6a;animation:blink .5s steps(2) infinite}
.tbig.done,.tbig2.done{color:#ff4040}
.tbar .btn{min-height:54px}
.tbig2{font-size:76px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:#ffd24d;line-height:1.1}
@keyframes blink{50%{opacity:.35}}
#hud{position:fixed;z-index:12;top:5px;left:50%;transform:translateX(-50%);display:none;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.05em;padding:0 20px;height:48px;line-height:48px;border-radius:14px;background:linear-gradient(#0e2a8c,#071a63);border:2px solid var(--gold);box-shadow:0 0 22px rgba(255,200,61,.55);pointer-events:none}
#hud.on{display:block}
#hud.paused{opacity:.85;border-style:dashed}
#hud.warn{background:linear-gradient(#e11,#900);border-color:#fff;animation:blink .5s steps(2) infinite}
#hud.done{background:linear-gradient(#e11,#900);border-color:#fff}
body.present #hud{top:12px;font-size:clamp(46px,calc(9*var(--u)),92px);height:auto;line-height:1.15;padding:0 28px}
body.warn5:after{content:"";position:fixed;inset:0;z-index:11;pointer-events:none;box-shadow:inset 0 0 0 10px rgba(255,40,40,.85),inset 0 0 90px rgba(255,40,40,.6);animation:blink .5s steps(2) infinite}
#timeup{position:fixed;inset:0;z-index:30;display:none;place-items:center;pointer-events:none;background:rgba(200,0,0,.62);font-size:clamp(54px,calc(18*var(--u)),170px);font-weight:900;letter-spacing:.08em;text-shadow:0 6px 30px #000;animation:blink .45s steps(2) infinite}
#timeup.on{display:grid}

/* ---------- varios ---------- */
.flash{position:absolute;inset:0;pointer-events:none;border-radius:0;animation:fl .75s ease-out forwards;z-index:5}
.flash.ok{background:radial-gradient(circle,rgba(46,230,120,.65),rgba(46,230,120,0) 70%)}
.flash.bad{background:radial-gradient(circle,rgba(255,60,60,.7),rgba(255,60,60,0) 70%)}
@keyframes fl{from{opacity:1}to{opacity:0}}
#toast{position:fixed;left:50%;top:62px;transform:translate(-50%,-20px);max-width:92vw;background:rgba(5,12,40,.95);border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:800;font-size:16px;z-index:40;opacity:0;pointer-events:none;transition:.25s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.mb{position:fixed;inset:0;background:rgba(2,6,23,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:min(560px,100%);background:linear-gradient(#12288a,#0a1747);border:2px solid rgba(255,200,61,.55);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-size:22px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips .btn{min-height:52px;font-size:18px}
.chips .btn.on{background:linear-gradient(#ffe083,#ffb700);color:#2b1c00}
.hero{text-align:center;padding:2px 0}
.stagehome{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.insts{display:flex;justify-content:center;gap:clamp(6px,calc(2.6*var(--u)),26px);color:var(--gold);opacity:.9}
.insts svg{width:clamp(30px,calc(10*var(--u)),72px);height:auto}
.present .stagehome{gap:4vh}

/* ---------- ajustes para móvil apaisado (TV en horizontal) ---------- */
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  :root{--u:1.25vh}
  .tgrid{grid-template-columns:repeat(3,1fr);gap:6px}

  .rks{gap:5px}.rk{min-height:38px;padding:3px 10px 3px 6px}.rk .pos{width:32px;height:32px;font-size:18px}
  .win .trophy{width:calc(24*var(--u))}
  .stitle{margin:0 0 5px}.frag{margin:0 0 2px}.fdots{margin-bottom:5px}

  .p4w{gap:5px}
  .strip .sc{padding:1px 8px}
  .present .stage{padding:10px 14px}
  .present .tgrid{gap:10px}
  .lockup .l2:before,.lockup .l2:after{width:8vw}
  .stagehome{gap:8px}
  .fn b{font-size:calc(11*var(--u))}.eq{height:calc(9*var(--u))}
  .fdots i{width:calc(6.2*var(--u));height:calc(6.2*var(--u));font-size:calc(2.8*var(--u))}
  .tc .pt{font-size:calc(7*var(--u))}.tc .nm{font-size:calc(3.6*var(--u))}
  .rk .pt{font-size:calc(6.4*var(--u))}.rk .nm{font-size:calc(4.6*var(--u))}
  .win .trophy{width:calc(19*var(--u))}.win .wn{font-size:calc(11*var(--u))}.win .wk{font-size:calc(5*var(--u))}.win .ws{font-size:calc(4*var(--u))}.win .wf{font-size:calc(2.2*var(--u));margin-top:2px}
  .present .tc .pt{font-size:calc(9*var(--u))}.present .tc .nm{font-size:calc(4.6*var(--u))}
}
@media (max-height:700px){
  .tb{min-height:48px}
  .controls{gap:7px;padding-top:8px}
  .btn.big{min-height:60px}.btn.xl{min-height:68px}
  .row3 .btn{font-size:16px}
}

<script>
(()=>{
'use strict';
/* =====================================================================
   OÍDO FINO · II EDICIÓN · ESPECIAL SANTA CECILIA 2026
   Aplicación sin servidor ni dependencias. Todo se guarda en el móvil.
   ===================================================================== */
const KEY='oidofino.v1', KEY_U='oidofino.v1.undo', KEY_T='oidofino.v1.timer';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAMS=[
 {name:'Trompeta', color:'#e53935', ink:'#ffffff', cn:'Rojo'},
 {name:'Flauta',   color:'#1fd1c4', ink:'#03262b', cn:'Turquesa'},
 {name:'Clarinete',color:'#a04dff', ink:'#ffffff', cn:'Morado'},
 {name:'Saxofón',  color:'#ffc21a', ink:'#2a1c00', cn:'Dorado'},
 {name:'Percusión',color:'#2f7bff', ink:'#ffffff', cn:'Azul'},
 {name:'Trompa',   color:'#ff5fa8', ink:'#3a0220', cn:'Rosa'}];
const LETTERS=[...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];
const PRUEBAS=[
 {n:1,t:'Rosco inicial por equipos',s:'p1'},
 {n:2,t:'Adivina la melodía',s:'p2'},
 {n:3,t:'El público es nuestro comodín',s:'p3'},
 {n:4,t:'Gran Pasapalabra Musical',s:'p4'},
 {n:5,t:'Desempate y premios',s:'final'}];

/* ---------- iconos ---------- */
const IC={
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 note:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 tv:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
 pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>',
 check:'<path d="M4 12l5 5L20 6" stroke-width="3.2"/>',
 cross:'<path d="M5 5l14 14M19 5L5 19" stroke-width="3.2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
 crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" fill="currentColor"/>',
 skip:'<path d="M5 4l10 8-10 8zM19 5v14"/>',
 trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/>',
 users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a6 6 0 0 1 3 6"/>',
 full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
 vol:'<path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6"/>',
 up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 swords:'<path d="M5 19L19 5M14 5h5v5M5 5l14 14"/>'
};
const ic=(n,s=26)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- estado ---------- */
const freshGame=()=>({
  p1:TEAMS.map(()=>[null,null,null,null]),
  p2:{frag:0,d:Array.from({length:8},()=>TEAMS.map(()=>({t:0,a:0})))},
  p3:TEAMS.map(()=>({c:0,r:null})),
  adj:TEAMS.map(()=>0),
  rosco:{round:1,L:LETTERS.map(()=>({s:'p',t:null})),h:LETTERS.map(()=>false),cur:0},
  tie:{w:null}
});
const okGame=g=>g&&Array.isArray(g.p1)&&g.p1.length===6&&g.p2&&g.p2.d&&g.p2.d.length===8&&Array.isArray(g.p3)&&g.p3.length===6&&Array.isArray(g.adj)&&g.adj.length===6&&g.rosco&&g.rosco.L&&g.rosco.L.length===27&&g.rosco.h&&g.rosco.h.length===27&&g.tie;
let storageOK=true;
function rd(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){storageOK=false}}
function initState(){
  const base={v:1,names:TEAMS.map(t=>t.name),sound:true,vol:1,game:freshGame(),cur:1,screen:'home',started:false,
              timer:{dur:30,rem:30000,run:false},undo:[]};
  const o=rd(KEY); if(!o||o.v!==1) return base;
  const s=Object.assign(base,o);
  if(!okGame(s.game)) s.game=freshGame();
  if(!Array.isArray(s.names)||s.names.length!==6) s.names=TEAMS.map(t=>t.name);
  const u=rd(KEY_U); s.undo=Array.isArray(u)?u:[];
  const t=rd(KEY_T); if(t&&typeof t.dur==='number'&&typeof t.rem==='number') s.timer={dur:t.dur,rem:Math.max(0,t.rem),run:false};
  if(!SCREENS_OK.includes(s.screen)) s.screen='home';
  return s;
}
const SCREENS_OK=['home','config','menu','p1','p2','p3','p4','score','final','tie','winner'];
const S=initState();
const ui={sel:null,present:false,modal:null,flash:null,pop:null};
function save(){const {undo,timer,...rest}=S; wr(KEY,rest); wr(KEY_U,S.undo); wr(KEY_T,S.timer);}
const saveTimer=()=>wr(KEY_T,S.timer);
const name=i=>(S.names[i]||'').trim()||TEAMS[i].name;
const nm=i=>`<span data-nm="${i}">${esc(name(i))}</span>`;
const cs=i=>`--c:${TEAMS[i].color};--ink:${TEAMS[i].ink}`;

/* ---------- puntuación (siempre calculada, nunca desincronizada) ---------- */
function breakdown(i){
  const g=S.game;
  const p1=g.p1[i].reduce((s,x)=>s+(x===1?2:0),0);
  const p2=g.p2.d.reduce((s,f)=>s+f[i].t*2+f[i].a,0);
  const c=g.p3[i]; const p3=c.r==='ok'?(c.c?2:3):0;
  const p4=g.rosco.L.filter(l=>l.s==='w'&&l.t===i).length;
  const adj=g.adj[i];
  return {p1,p2,p3,p4,adj,total:p1+p2+p3+p4+adj};
}
function ranking(){
  let rows=TEAMS.map((t,i)=>Object.assign({i},breakdown(i)));
  rows.sort((a,b)=>b.total-a.total||a.i-b.i);
  rows.forEach((r,k)=>{r.pos=(k&&r.total===rows[k-1].total)?rows[k-1].pos:k+1;r.tb='';});
  const top=rows.filter(r=>r.pos===1).map(r=>r.i);
  const tied=top.length>1;
  let w=S.game.tie.w; if(tied&&!top.includes(w)) w=null;
  let winner;
  if(tied){
    winner=w;
    if(w!=null){
      rows=[rows.find(r=>r.i===w),...rows.filter(r=>r.pos===1&&r.i!==w),...rows.filter(r=>r.pos!==1)];
      rows.forEach(r=>{ if(r.pos===1){ if(r.i===w) r.tb='win'; else {r.pos=2;r.tb='lose';} } });
    }
  } else winner=top[0];
  return {rows,tied,top,winner,decided:!tied||w!=null};
}

/* ---------- deshacer ---------- */
function pushUndo(label){
  S.undo.push({l:label,s:JSON.stringify(S.game),sc:S.screen});
  if(S.undo.length>80) S.undo.shift();
}
function undo(){
  const u=S.undo.pop();
  if(!u){toast('No hay nada que deshacer');return;}
  S.game=JSON.parse(u.s); ui.sel=null;
  if(u.sc&&u.sc!==S.screen&&SCREENS_OK.includes(u.sc)) S.screen=u.sc;
  save(); render(); toast('↩ Deshecho: '+u.l);
}
function act(label,fn,o={}){
  pushUndo(label); fn();
  ui.flash=o.flash||null; ui.pop=o.pop==null?null:o.pop;
  if(o.snd) sfx(o.snd);
  save(); render(); toast(label);
}

/* ---------- sonido (WebAudio, sin archivos) ---------- */
let AC=null;
function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t0,d,type='sine',vol=.28){
  if(!S.sound)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=f;
  const t=c.currentTime+t0; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
function sfx(k){
  if(k==='ok'){tone(523,0,.16,'triangle');tone(659,.1,.16,'triangle');tone(784,.2,.4,'triangle');}
  else if(k==='bad'){tone(160,0,.35,'sawtooth',.22);tone(110,.18,.45,'sawtooth',.22);}
  else if(k==='none'){tone(330,0,.18,'sine',.18);}
  else if(k==='tick'){tone(990,0,.12,'square',.2);}
  else if(k==='end'){tone(440,0,.5,'sawtooth',.3);tone(440,.6,.5,'sawtooth',.3);tone(660,1.2,1.1,'sawtooth',.3);}
  else if(k==='fan'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.17,i==3?1.3:.28,'triangle',.3));tone(262,.5,1.2,'sine',.25);tone(392,.5,1.2,'sine',.2);}
}
let tt0;

/* ---------- cronómetro ---------- */
const T={iv:0,end:0,last:-1};
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const timerActive=()=>S.timer.run||S.timer.rem!==S.timer.dur*1000;
function tstart(){
  ac(); const t=S.timer; if(t.rem<=0) t.rem=t.dur*1000;
  T.end=Date.now()+t.rem; t.run=true; T.last=-1;
  clearInterval(T.iv); T.iv=setInterval(tick,100); saveTimer(); render();
}
function tpause(){clearInterval(T.iv); const t=S.timer; t.rem=Math.max(0,T.end-Date.now()); t.run=false; saveTimer(); render();}
function treset(){clearInterval(T.iv); S.timer.run=false; S.timer.rem=S.timer.dur*1000; $('#timeup').classList.remove('on'); saveTimer(); render();}
function tick(){
  const t=S.timer; const rem=Math.max(0,T.end-Date.now()); t.rem=rem;
  const sec=Math.ceil(rem/1000);
  if(sec!==T.last){T.last=sec; if(sec<=5&&sec>0) sfx('tick'); saveTimer();}
  if(rem<=0){
    clearInterval(T.iv); t.run=false; saveTimer(); sfx('end');
    const tu=$('#timeup'); tu.classList.add('on'); setTimeout(()=>tu.classList.remove('on'),3200);
    render();
  }
  updateTimerUI();
}
function updateTimerUI(){
  const t=S.timer, rem=t.rem, act=timerActive();
  const warn=t.run&&rem<=5000&&rem>0, done=rem<=0;
  $$('[data-tt]').forEach(el=>{el.textContent=fmt(rem); el.classList.toggle('warn',warn); el.classList.toggle('done',done);});
  const h=$('#hud'); h.className=act?('on'+(warn?' warn':'')+(done?' done':'')+(t.run?'':' paused')):''; h.textContent=act?fmt(rem):'';
  document.body.classList.toggle('warn5',warn);
}
function timerBar(){
  const t=S.timer, act=timerActive();
  return `<div class="tbar"><div class="tbig" data-tt>${fmt(t.rem)}</div>
   <button class="btn ${t.run?'gold':'ok'}" data-act="${t.run?'tpause':'tstart'}">${ic(t.run?'pause':'play')}${t.run?'Pausar':(act&&t.rem>0?'Seguir':'Iniciar')}</button>
   <button class="btn ghost" data-act="treset" aria-label="Reiniciar cronómetro">${ic('undo')}</button>
   <button class="btn ghost" data-act="modal" data-k="timer" aria-label="Configurar cronómetro">${ic('gear')}</button></div>`;
}

AU.el.preload='auto';
const mmss=s=>{s=isFinite(s)?Math.floor(s):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function updateAudioUI(){
  const el=AU.el, d=el.duration||0, ct=el.currentTime||0;
  const tm=$('[data-au=time]'); if(tm) tm.textContent=mmss(ct)+' / '+mmss(d);
  const sk=$('#aseek'); if(sk&&!AU.seeking) sk.value=d?Math.round(ct/d*1000):0;

const DB={db:null,
  open(){return new Promise(res=>{try{const rq=indexedDB.open('oidofino',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('clips');rq.onsuccess=()=>{DB.db=rq.result;res(true)};rq.onerror=()=>res(false);}catch(e){res(false)}})},
  tx(m){return DB.db.transaction('clips',m).objectStore('clips')},
  put(k,v){return new Promise(res=>{try{const r=DB.tx('readwrite').put(v,k);r.onsuccess=()=>res(true);r.onerror=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{try{const r=DB.tx('readonly').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})},
  del(k){return new Promise(res=>{try{const r=DB.tx('readwrite').delete(k);r.onsuccess=()=>res(true);r.onerror=()=>res(false)}catch(e){res(false)}})}
};
async function loadClips(){
  if(!(await DB.open())) return;
  for(let i=0;i<8;i++){const b=await DB.get(i); if(b) AU.urls[i]=URL.createObjectURL(b);}
  render();
}
function addClip(i,file){
  if(AU.urls[i]) URL.revokeObjectURL(AU.urls[i]);
  AU.urls[i]=URL.createObjectURL(file);

  if(DB.db) DB.put(i,file);
}

  const r=S.game.rosco;

  r.cur=null;
}

  const r=S.game.rosco, l=r.L[i], ang=(-90+i*360/27)*Math.PI/180, R=43.4;
  const x=(50+R*Math.cos(ang)).toFixed(2), y=(50+R*Math.sin(ang)).toFixed(2), cur=r.cur===i;
  let fill,stroke,tc;
  if(l.s==='w'){const t=TEAMS[l.t];fill=t.color;stroke='#ffffff';tc=t.ink;}
  else if(l.s==='x'){fill='#262b38';stroke='#555d70';tc='#7a8298';}
  else{fill='#10286b';stroke='#6f9bff';tc='#ffffff';}
  return `<g transform="translate(${x} ${y})" class="lt ${cur?'cur':''} ${ui.pop===i?'pop':''}" data-act="letter" data-i="${i}"><g class="in">${cur?'<circle class="ring" r="6.5"/>':''}<circle r="4.75" fill="${fill}" stroke="${stroke}" stroke-width="${cur?.9:.6}"/><text class="lx" fill="${tc}" dy=".36em" text-anchor="middle">${LETTERS[i]}</text></g></g>`;

function roscoSvg(){
  let dots='';
  for(let k=0;k<54;k++){const a=k*Math.PI*2/54;dots+=`<circle class="mq ${k%2?'a':'b'}" cx="${(50+49.3*Math.cos(a)).toFixed(2)}" cy="${(50+49.3*Math.sin(a)).toFixed(2)}" r=".5"/>`;}
  return `<svg class="rosco" viewBox="0 0 100 100" role="img" aria-label="Rosco de 27 letras">
   <defs><radialGradient id="cg"><stop offset="0" stop-color="#1b3fb0"/><stop offset="1" stop-color="#081445"/></radialGradient><clipPath id="cc"><circle cx="50" cy="50" r="37.2"/></clipPath></defs>
   <circle cx="50" cy="50" r="48.4" fill="#0a1a55" stroke="#ffc83d" stroke-width=".7"/>
   ${dots}
   <circle cx="50" cy="50" r="37.8" fill="url(#cg)" stroke="#ffc83d" stroke-opacity=".7" stroke-width=".5"/>
   <g clip-path="url(#cc)" stroke="#9db8ff" stroke-opacity=".22" stroke-width=".35"><line x1="10" x2="90" y1="38" y2="38"/><line x1="10" x2="90" y1="44" y2="44"/><line x1="10" x2="90" y1="50" y2="50"/><line x1="10" x2="90" y1="56" y2="56"/><line x1="10" x2="90" y1="62" y2="62"/></g>
   ${LETTERS.map((_,i)=>letterG(i)).join('')}</svg>`;
}
function strip(){
  const rk=ranking();
  return `<div class="strip">${TEAMS.map((t,i)=>{const lead=rk.rows[0].i===i&&breakdown(i).total>0&&rk.rows[0].pos===1;return `<div class="sc ${lead?'lead':''}" style="${cs(i)}">${lead?`<span class="cr">${ic('crown',14)}</span>`:''}<span class="sn">${nm(i)}</span><b>${breakdown(i).total}</b></div>`;}).join('')}</div>`;

function p4Stage(){

  if(inf.phase==='play') c=`<div class="rc-round">${r.round}ª VUELTA</div><div class="rc-letter">${LETTERS[r.cur]}</div>${sel!=null?`<div class="rc-sel" style="${cs(sel)}">${nm(sel)}</div>`:`<div class="rc-hint">Quedan ${inf.toRead}</div>`}`;

  else c=`<div class="rc-big">ROSCO<br>COMPLETADO</div><div class="rc-hint">Acertadas ${inf.won} · Sin resolver ${inf.lost}</div>`;

function rAns(k){
  const r=S.game.rosco; if(r.cur==null){toast('No hay letra activa');return;}
  if(k!=='none'&&ui.sel==null){toast('Primero toca el equipo que responde');return;}
  const i=r.cur, L=LETTERS[i], team=ui.sel;
  const lab=k==='ok'?`Letra ${L} · ${name(team)} +1`:k==='bad'?`Letra ${L} · fallo de ${name(team)}`:`Letra ${L} · nadie responde`;
  act(lab,()=>{
    const l=r.L[i];
    if(k==='ok'){l.s='w';l.t=team;}
    else if(r.round===2){l.s='x';l.t=null;}
    r.h[i]=true; advance(i); ui.sel=null;
  },{flash:k==='ok'?'ok':k==='bad'?'bad':null,pop:k==='ok'?i:null,snd:k});
}
function startR2(){
  act('Inicio de la 2ª vuelta',()=>{const r=S.game.rosco;r.round=2;r.h=r.L.map(()=>false);advance(-1);ui.sel=null;},{snd:'ok'});
}
function setLetter(i,mode,team){
  const L=LETTERS[i];
  const lab=mode==='w'?`Letra ${L} → ${name(team)}`:mode==='p'?`Letra ${L} → pendiente`:mode==='x'?`Letra ${L} → sin resolver`:`Ir a la letra ${L}`;
  act(lab,()=>{
    const r=S.game.rosco,l=r.L[i];
    if(mode==='w'){l.s='w';l.t=team;r.h[i]=true;if(r.cur===i)advance(i);}
    else if(mode==='p'){l.s='p';l.t=null;r.h[i]=false;if(r.cur==null)r.cur=i;}
    else if(mode==='x'){l.s='x';l.t=null;r.h[i]=true;if(r.cur===i)advance(i);}
    else if(mode==='g'){l.s='p';l.t=null;r.h[i]=false;r.cur=i;}
    ui.modal=null;
  },{pop:mode==='w'?i:null});
}

/* ---------- confeti ---------- */
const CF={on:false,parts:[],raf:0};
function confettiOn(burst){
  const cv=$('#confetti');
  if(CF.on&&!burst) return;
  CF.on=true; cv.style.display='block';
  const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const pal=['#ffc83d','#ffffff','#2f7bff','#ffe083',...TEAMS.map(t=>t.color)];
  CF.parts=Array.from({length:200},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,w:(6+Math.random()*8)*dpr,h:(10+Math.random()*10)*dpr,vy:(2+Math.random()*4)*dpr,vx:(Math.random()-.5)*2*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pal[Math.random()*pal.length|0],p:Math.random()*6}));
  cancelAnimationFrame(CF.raf);
  const ctx=cv.getContext('2d');
  const loop=()=>{
    if(!CF.on)return;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of CF.parts){
      p.y+=p.vy; p.p+=.05; p.x+=p.vx+Math.sin(p.p)*dpr; p.r+=p.vr;
      if(p.y>cv.height+30){p.y=-20;p.x=Math.random()*cv.width;}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    CF.raf=requestAnimationFrame(loop);
  };
  loop();
}
function confettiOff(){ if(!CF.on)return; CF.on=false; cancelAnimationFrame(CF.raf); const cv=$('#confetti'); cv.style.display='none'; }

/* ---------- render ---------- */
const SCR={
  home:{stage:homeStage,controls:homeControls},
  config:{stage:cfgStage,controls:cfgControls},
  menu:{stage:menuStage,controls:menuControls},
  p1:{stage:p1Stage,controls:p1Controls},
  p2:{stage:p2Stage,controls:p2Controls},
  p3:{stage:p3Stage,controls:p3Controls},
  p4:{stage:p4Stage,controls:p4Controls},
  score:{stage:scoreStage,controls:scoreControls},
  final:{stage:finalStage,controls:finalControls},
  tie:{stage:tieStage,controls:tieControls},
  winner:{stage:winnerStage,controls:winnerControls}
};
let lastScreen=null;
function render(){
  const sc=SCR[S.screen]||SCR.home;
  const ctl=$('.controls'), st=ctl?ctl.scrollTop:0;
  const flash=ui.flash; ui.flash=null;
  const html=(ui.present?'':header())+`<main class="view"><section class="stage">${sc.stage()}${flash?`<div class="flash ${flash}"></div>`:''}</section>${ui.present?'':`<section class="controls">${sc.controls()}</section>`}</main>`
    +(ui.present?`<button class="exitp" data-act="present" aria-label="Salir de la presentación">${ic('cross',22)}</button>`:'')+modalHtml();
  ui.pop=null;
  const app=$('#app'); app.className=(ui.present?'present ':'')+'s-'+S.screen;
  document.body.classList.toggle('present',ui.present);
  app.innerHTML=html;
  const c2=$('.controls'); if(c2) c2.scrollTop=(lastScreen===S.screen)?st:0;
  lastScreen=S.screen;
  updateTimerUI(); updateAudioUI();
  if(S.screen==='winner') confettiOn(); else confettiOff();
}
function go(s){
  if(s==='winner'&&!ranking().decided){toast('Primero hay que resolver el desempate');return;}
  audioStop(); ui.sel=null; ui.modal=null; S.screen=s;
  const pr={p1:1,p2:2,p3:3,p4:4,final:5,tie:5,winner:5}[s]; if(pr) S.cur=pr;
  save(); render();
  if(s==='winner'){sfx('fan');confettiOn(true);}
}
function fs(){
  try{ if(!document.fullscreenElement){const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'}); if(p&&p.catch)p.catch(()=>{});} else document.exitFullscreen(); }catch(e){}
}

  go:d=>go(d.s),
  start:()=>{S.started=true;go('menu');},
  sel:d=>{const i=+d.i; ui.sel=ui.sel===i?null:i; render();},
  present:()=>{ui.present=!ui.present; ui.modal=null; if(ui.present&&!document.fullscreenElement)fs(); render();},
  fs:()=>fs(),
  undo:()=>undo(),
  modal:d=>{ui.modal={k:d.k}; render();},
  bk:(d,b,e)=>{if(e.target===b){ui.modal=null;render();}},
  closeModal:()=>{ui.modal=null;render();},
  snd:()=>{S.sound=!S.sound;save();render();if(S.sound)sfx('ok');},
  install:()=>{if(installEv){installEv.prompt();installEv=null;render();}},
  tstart,tpause,treset,
  tdur:d=>{const t=S.timer;t.dur=+d.s;t.rem=t.dur*1000;saveTimer();render();},
  tadj:d=>{const t=S.timer;t.dur=Math.min(3599,Math.max(5,t.dur+ +d.d));t.rem=t.dur*1000;saveTimer();render();},
  p1ans:d=>p1Ans(+d.v),
  p1slot:d=>{const i=ui.sel;if(i==null)return;const q=+d.q;const cur=S.game.p1[i][q];const nx=cur==null?1:cur===1?0:null;
    act(`${name(i)} · pregunta ${q+1} → ${nx==null?'sin responder':nx?'acierto':'fallo'}`,()=>{S.game.p1[i][q]=nx;});},
  afrag:d=>{audioStop();AU.cur=null;S.game.p2.frag=+d.i;save();render();},
  fstep:d=>{const n=Math.min(7,Math.max(0,S.game.p2.frag+ +d.d));audioStop();AU.cur=null;S.game.p2.frag=n;save();render();},
  aplay:()=>{const f=S.game.p2.frag;if(!AU.urls[f]){toast('No hay audio en este fragmento');return;}ac();
    if(AU.cur!==f){AU.el.src=AU.urls[f];AU.cur=f;}
    if(AU.el.paused){const p=AU.el.play();if(p&&p.catch)p.catch(()=>toast('No se ha podido reproducir este archivo'));}else AU.el.pause();},
  astop:()=>audioStop(),
  aclear:()=>{const f=S.game.p2.frag;audioStop();AU.cur=null;if(AU.urls[f]){URL.revokeObjectURL(AU.urls[f]);delete AU.urls[f];}if(DB.db)DB.del(f);render();toast('Audio quitado');},
  p2t:()=>p2Toggle('t'), p2a:()=>p2Toggle('a'),
  p3c:()=>{const i=ui.sel;if(i==null)return toast('Primero elige un equipo');const c=S.game.p3[i];
    act(`${name(i)} · comodín ${c.c?'quitado':'usado'}`,()=>{c.c=c.c?0:1;},{snd:'none'});},
  p3r:d=>{const i=ui.sel;if(i==null)return toast('Primero elige un equipo');const c=S.game.p3[i];const same=c.r===d.r;
    act(same?`${name(i)} · resultado quitado`:`${name(i)} · ${d.r==='ok'?'acierta +'+(c.c?2:3):'falla'}`,()=>{c.r=same?null:d.r;},{flash:same?null:d.r,snd:same?null:d.r});},
  rans:d=>rAns(d.k), r2:startR2,
  letter:d=>{if(ui.present)return;ui.modal={k:'letter',i:+d.i};render();},
  lset:d=>setLetter(ui.modal.i,d.m,d.t==null?null:+d.t),
  adj:d=>{const i=+d.i,v=+d.d;act(`Ajuste manual ${name(i)} ${v>0?'+1':'−1'}`,()=>{S.game.adj[i]+=v;});},
  tiew:d=>{const i=+d.i;act(`Desempate: gana ${name(i)}`,()=>{S.game.tie.w=i;},{snd:'ok'});},
  tieclr:()=>act('Desempate: resultado quitado',()=>{S.game.tie.w=null;}),
  fan:()=>{sfx('fan');confettiOn(true);},
  doReset:()=>{
    S.game=freshGame(); S.undo=[]; S.cur=1; S.started=false; ui.sel=null; ui.modal=null; audioStop(); AU.cur=null;
    clearInterval(T.iv); S.timer.run=false; S.timer.rem=S.timer.dur*1000; $('#timeup').classList.remove('on');
    S.screen='home'; save(); render(); toast('Concurso reiniciado');
  },
  doNames:()=>{S.names=TEAMS.map(t=>t.name);ui.modal=null;save();render();}
};
function p2Toggle(k){
  const i=ui.sel; if(i==null){toast('Primero elige un equipo');return;}
  const f=S.game.p2.frag, d=S.game.p2.d[f][i];
  act(`Frag. ${f+1} · ${name(i)} · ${k==='t'?'título':'autor'} ${d[k]?'quitado':'+'+(k==='t'?2:1)}`,()=>{d[k]=d[k]?0:1;},{flash:d[k]?null:'ok',snd:d[k]?null:'ok'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  const f=ACT[b.dataset.act]; if(f)f(b.dataset,b,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.name!=null){
    const i=+t.dataset.name; S.names[i]=t.value; save();
    $$(`[data-nm="${i}"]`).forEach(el=>el.textContent=name(i));
  } else if(t.id==='aseek'){
    const d=AU.el.duration; if(d) AU.el.currentTime=t.value/1000*d;
  } else if(t.id==='avol'){
    S.vol=t.value/100; AU.el.volume=S.vol; save();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.name!=null){
    const i=+t.dataset.name; if(!t.value.trim()){S.names[i]=TEAMS[i].name;t.value=TEAMS[i].name;save();$$(`[data-nm="${i}"]`).forEach(el=>el.textContent=name(i));}
  } else if(t.id==='fileOne'&&t.files&&t.files[0]){
    const f=S.game.p2.frag; addClip(f,t.files[0]); render(); toast('Audio cargado en el fragmento '+(f+1));
  } else if(t.id==='fileMany'&&t.files&&t.files.length){
    const fl=[...t.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).slice(0,8);
    fl.forEach((f,k)=>addClip(k,f)); render(); toast(`${fl.length} audio${fl.length>1?'s':''} cargado${fl.length>1?'s':''} (fragmentos 1 a ${fl.length})`);
  }
});
document.addEventListener('pointerdown',e=>{if(e.target.id==='aseek')AU.seeking=true;});
document.addEventListener('pointerup',()=>{AU.seeking=false;});
document.addEventListener('pointerdown',()=>{wake();},{once:true});

/* ---------- pantalla encendida, botón atrás, instalación ---------- */
let WL=null;
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')WL=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake(); else {save();}});
window.addEventListener('pagehide',save);
try{history.pushState(null,'',location.href);}catch(e){}
window.addEventListener('popstate',()=>{
  try{history.pushState(null,'',location.href);}catch(e){}
  if(ui.modal){ui.modal=null;render();}
  else if(ui.present){ui.present=false;render();}
  else if(S.screen!=='home'&&S.screen!=='menu') go('menu');
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(S.screen==='home')render();});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('resize',()=>{if(CF.on)confettiOn(true);});

/* ---------- arranque ---------- */
if(S.timer.rem<=0) {/* se conserva en 00:00 hasta reiniciar */}
render();
wake();
loadClips();
window.OF={S,ui,AU,ranking,breakdown,LETTERS,TEAMS,go,render,act,advance,roscoInfo};
})();
</script>
</body>
</html>
